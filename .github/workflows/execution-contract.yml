name: Execution Contract

on:
  pull_request:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate execution contracts
        run: node tools/execution/validate.mjs

      - name: Check diff whitespace
        run: git diff --check