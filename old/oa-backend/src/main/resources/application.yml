server:
  port: 10001
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: oa-platform
  profiles:
    active: dev
  # JSON 格式化
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

---
# 开发环境
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:oa_platform}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${MYSQL_USERNAME:oa_user}
    password: ${REDIS_PASSWORD}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      test-while-idle: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      database: 7
      timeout: 5s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
      password: ${REDIS_PASSWORD}

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.oa.platform.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# OA 自定义配置
oa:
  # JWT 配置
  jwt:
    secret: ${JWT_SECRET}
    # token 有效期（720m = 720 分钟 / 12 小时）
    expire: 720m
    header: Authorization
    token-prefix: "Bearer "
  # 验证码开关
  captcha:
    enabled: true
  # 文件存储
  file:
    # local 本地存储
    type: local
    local-path: ./oa-files
    url-prefix: /file
  # 初始超级管理员账号
  init:
    admin-username: admin
    admin-password: ${ADMIN_PASSWORD}

# Knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.oa.platform: debug
    org.springframework.security: info
